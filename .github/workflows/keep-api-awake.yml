# The API runs on Render's free plan, which puts it to sleep after 15 idle
# minutes; the first request after that waits while Spring Boot starts again.
# A look at the health check every ten minutes keeps it awake. One service
# awake all month is ~744 hours of the workspace's 750 free ones — a second
# free service on the same Render account would run both out before the month
# ends. GitHub runs scheduled jobs late when it is busy and stops them after 60
# days without a push to the repository; "Run workflow" on the Actions tab
# starts it by hand.
name: Keep the API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the API whether it is up
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 120 https://tripyfull-api.onrender.com/actuator/health
