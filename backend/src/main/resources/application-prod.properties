# Production — everything that differs from a laptop comes from the environment.
# The database's host, name, user and password are typed into the Render
# dashboard (they belong to a Neon project, see docs/deploy.md); render.yaml
# generates the JWT secret and Render hands over the port. Nothing secret here.

server.port=${PORT:8080}

# `prefer` negotiates SSL where the server offers it (Neon requires it) and
# falls back to plain where it does not (a local Postgres in Docker).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
# A small pool: the free database sleeps after five idle minutes and closes
# what was open; the pool checks a connection before handing it out and
# replaces a dead one, and there are only a few visitors at a time.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=240000

# Flyway creates the schema on an empty database and moves it forward after that.
spring.flyway.enabled=true

# Must be at least 32 characters; render.yaml generates one.
jwt.secret=${JWT_SECRET}

# Photos and tickets — a disk mounted here outlives a deploy.
app.upload-dir=${UPLOAD_DIR:/var/data/uploads}

# Behind Render's proxy the app sees http; this makes it trust the forwarded scheme.
server.forward-headers-strategy=framework
