# Production — everything that differs from a laptop comes from the environment.
# Render fills these from render.yaml (the database's own host, port, name, user
# and password; a generated JWT secret; the port it routes to). Anything secret
# is set in the Render dashboard, never here.

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

# Flyway creates the schema on an empty database and moves it forward after that.
spring.flyway.enabled=true

# Must be at least 32 characters; render.yaml generates one.
jwt.secret=${JWT_SECRET}

# Photos and tickets — a disk mounted here outlives a deploy.
app.upload-dir=${UPLOAD_DIR:/var/data/uploads}

# Behind Render's proxy the app sees http; this makes it trust the forwarded scheme.
server.forward-headers-strategy=framework
