spring.application.name=tripyfull
spring.profiles.default=local

# Schema is managed by Flyway (src/main/resources/db/migration). A database that
# already has the schema but no Flyway history is baselined at V1 on first run.
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

jwt.expiration=86400000

# AeroDataBox flight lookup — set the key via env in real deployments (local profile overrides for dev).
aerodatabox.api-key=${AERODATABOX_API_KEY:}
aerodatabox.api-host=aerodatabox.p.rapidapi.com



# Geocoding for Places — Photon by komoot (free, no key), Nominatim fallback.
# Optional: OpenTripMap attraction enrichment (Wikipedia descriptions + photos on saved
# places). Free non-commercial key at https://dev.opentripmap.org — leave empty to disable.
opentripmap.api-key=${OPENTRIPMAP_API_KEY:}

# Uploads (a place's photos, a booking's tickets). `local` keeps them in a folder;
# `s3` puts them in an S3-compatible bucket — Cloudflare R2 in production, where
# the instance has no disk of its own. The S3_* variables are only read for `s3`.
app.storage=${APP_STORAGE:local}
app.upload-dir=${UPLOAD_DIR:uploads}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.region=${S3_REGION:auto}
# A whole trip file — tickets and photos inside — comes in as one upload. Photos
# and single attachments are held to 10 MB each in code.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
