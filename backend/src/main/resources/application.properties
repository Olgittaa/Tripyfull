spring.application.name=tripyfull
spring.profiles.default=local

# Schema is managed by Flyway (src/main/resources/db/migration). Databases created
# before Flyway was introduced are baselined past V1 on first run.
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

jwt.expiration=86400000

# AeroDataBox flight lookup — set the key via env in real deployments (local profile overrides for dev).
aerodatabox.api-key=${AERODATABOX_API_KEY:}
aerodatabox.api-host=aerodatabox.p.rapidapi.com

# Tripadvisor Terra (optional) — ratings + reviews on place cards when a key is set.
tripadvisor.api-key=${TRIPADVISOR_API_KEY:}

# Google Maps Platform (optional, paid) — when a key is set, place search, geocoding,
# enrichment (photos + descriptions) and day routing all use Google (Places API New +
# Routes API + higher-quality data); without a key the free OSM stack below is used.
# Required APIs on the key: "Places API (New)" and "Routes API".
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Geocoding for Places — Photon by komoot (free, no key), Nominatim fallback.
# Optional: OpenTripMap attraction enrichment (Wikipedia descriptions + photos on saved
# places). Free non-commercial key at https://dev.opentripmap.org — leave empty to disable.
opentripmap.api-key=${OPENTRIPMAP_API_KEY:}

# Attachments — local file storage + upload size limits
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
