# Render Blueprint: the API, declared once. Connecting this repository in
# Render ("New → Blueprint") creates it; later pushes to main redeploy it.
# Values marked `sync: false` are typed into the dashboard and never live here.
#
# The database is not on Render: it is a Neon project (free, and free of the
# 30-day expiry Render's free database has). Its host, name, user and password
# go into the five DB_* variables below. See docs/deploy.md.
#
# The frontend is not here — it is a static site on Cloudflare Pages, built
# from frontend/ with VITE_API_URL pointing at this service. See docs/deploy.md.

services:
  - type: web
    name: tripyfull-api
    runtime: docker
    region: frankfurt
    # Free to look at: the instance sleeps after 15 idle minutes (the first
    # visitor waits about a minute) and has no disk, so uploaded photos and
    # tickets last until the next deploy or restart. For real clients: plan
    # `starter` and a disk —
    #   disk: { name: uploads, mountPath: /var/data, sizeGB: 1 }
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70
      - key: JWT_SECRET
        generateValue: true
      # The Neon database — from the project's connection details. Use the
      # direct host, not the one ending in `-pooler`: Flyway needs a plain
      # connection, and the app keeps only a handful open.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Uploads live in a Cloudflare R2 bucket (S3-compatible); the free instance
      # has no disk. Endpoint is https://<account id>.r2.cloudflarestorage.com.
      - key: APP_STORAGE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto
      # Optional: flight lookup (RapidAPI) and Wikipedia enrichment.
      - key: AERODATABOX_API_KEY
        sync: false
      - key: OPENTRIPMAP_API_KEY
        sync: false
