<!-- @dsCard group="Planner" viewport="1280x820" name="Travel Planner (desktop app)" subtitle="Список, дашборд, маршрут, брони, бюджет — кликабельно" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripyfull — Travel Planner</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface-page); overflow: hidden; }
  #app { display: flex; height: 100vh; }
  .main { flex: 1; overflow-y: auto; height: 100vh; }
  .main::-webkit-scrollbar { width: 10px; }
  .main::-webkit-scrollbar-thumb { background: var(--ink-200); border-radius: 8px; border: 3px solid var(--surface-page); }
  @keyframes tfpop { from { transform: scale(0.96) translateY(8px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
  @keyframes tfshimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="data.js"></script>
  <script type="text/babel" src="parts.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="money.jsx"></script>
  <script type="text/babel">
    const DS = window.TripyfullDesignSystem_bc2c08;
    const { Button } = DS;
    const D = window.PlannerData;
    const { Sidebar, Drawer, Dialog } = window.PlannerParts;
    const { TripsList, Dashboard, DayItinerary, ActivityForm } = window.PlannerScreens;
    const { Bookings, BookingForm, Budget, NewTripForm, Placeholder } = window.PlannerMoney;

    function App() {
      const [tripId, setTripId] = React.useState(null);   // null = home
      const [view, setView] = React.useState('overview');
      const [dayId, setDayId] = React.useState('d3');
      const [loading, setLoading] = React.useState(true);

      // drawers / dialog
      const [actDrawer, setActDrawer] = React.useState(null);   // null | {} | activity
      const [bookDrawer, setBookDrawer] = React.useState(null);
      const [newTrip, setNewTrip] = React.useState(false);

      React.useEffect(() => { const t = setTimeout(() => setLoading(false), 900); return () => clearTimeout(t); }, []);

      const trip = D.trips.find(t => t.id === tripId);

      const openTrip = (id) => { setTripId(id); setView('overview'); };
      const goHome = () => setTripId(null);

      let body;
      if (!trip) {
        body = <TripsList loading={loading} onOpen={openTrip} onNew={() => setNewTrip(true)} />;
      } else if (view === 'overview') {
        body = <Dashboard trip={trip} onEdit={() => setNewTrip(true)} onGo={setView}
                  onOpenDay={(id) => { setDayId(id); setView('itinerary'); }} />;
      } else if (view === 'itinerary') {
        body = <DayItinerary trip={trip} dayId={dayId} setDayId={setDayId}
                  onAdd={() => setActDrawer({})} onEditActivity={(id) => setActDrawer(D.activities[id])} />;
      } else if (view === 'bookings') {
        body = <Bookings trip={trip} onAdd={() => setBookDrawer({})} onOpen={(id) => setBookDrawer(D.bookings.find(b => b.id === id))} />;
      } else if (view === 'budget') {
        body = <Budget trip={trip} />;
      } else {
        body = <Placeholder trip={trip} view={view} />;
      }

      return (
        <React.Fragment>
          <div id="app">
            <Sidebar trip={trip} view={view} onNav={setView} onHome={goHome} />
            <div className="main">{body}</div>
          </div>

          {/* Activity drawer */}
          <Drawer open={!!actDrawer} onClose={() => setActDrawer(null)}
            eyebrow={trip ? ('День · ' + (D.days.find(d=>d.id===dayId)||{}).city) : ''}
            title={actDrawer && actDrawer.id ? 'Активность' : 'Новая активность'}
            footer={<React.Fragment>
              <Button variant="primary" fullWidth onClick={() => setActDrawer(null)}>Сохранить</Button>
              {actDrawer && actDrawer.id && <Button variant="ghost" onClick={() => setActDrawer(null)}>Удалить</Button>}
            </React.Fragment>}>
            {actDrawer && <ActivityForm activity={actDrawer.id ? actDrawer : null} />}
          </Drawer>

          {/* Booking drawer */}
          <Drawer open={!!bookDrawer} onClose={() => setBookDrawer(null)} width={500}
            eyebrow="Бронь и платежи"
            title={bookDrawer && bookDrawer.id ? 'Бронь' : 'Новая бронь'}
            footer={<React.Fragment>
              <Button variant="primary" fullWidth onClick={() => setBookDrawer(null)}>Сохранить</Button>
              {bookDrawer && bookDrawer.id && <Button variant="ghost" onClick={() => setBookDrawer(null)}>Удалить</Button>}
            </React.Fragment>}>
            {bookDrawer && <BookingForm booking={bookDrawer.id ? bookDrawer : null} cur={trip ? trip.currency : '€'} />}
          </Drawer>

          {/* New trip dialog */}
          <Dialog open={newTrip} onClose={() => setNewTrip(false)}
            eyebrow={trip ? 'Редактировать' : 'Новая поездка'}
            title={trip ? trip.name : 'Куда отправляемся?'}
            footer={<React.Fragment>
              <Button variant="ghost" onClick={() => setNewTrip(false)}>Отмена</Button>
              <Button variant="primary" onClick={() => setNewTrip(false)}>Сохранить</Button>
            </React.Fragment>}>
            <NewTripForm />
          </Dialog>
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
