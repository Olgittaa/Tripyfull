services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on the host: 5432 is usually taken by a Postgres the machine already
      # runs for something else, and then this one cannot start at all.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tripdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
